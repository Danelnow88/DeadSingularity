<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON VOID · Jefes V11</title>
<style>
body{margin:0;padding:20px;background:#02040a;color:#e2f1ff;font:16px system-ui,sans-serif}header{max-width:1400px;margin:auto}h1{font-size:24px}button,select{font:inherit;color:inherit;background:#0d192e;border:1px solid #426177;border-radius:6px;padding:8px;margin:4px}main{max-width:1400px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}article{background:#070e20;border:1px solid #314961;border-radius:12px;padding:12px}h2{font-size:18px;margin:0}canvas{width:100%;height:auto;background:radial-gradient(circle,#0c1a38,#030612)}p{font-size:13px;line-height:1.4;color:#b8d6f0}
</style>
<header><h1>NEON VOID · Diseños de jefes V11</h1><button id="pause">Pausar</button><button id="hitbox">Mostrar hitbox</button><label>Escala <select id="scale"><option value="1">100%</option><option value="1.15" selected>115%</option><option value="1.3">130%</option></select></label></header>
<main id="gallery"></main>
<script>window.NV={};</script>
<script src="../../js/data/bossDesignLab.js"></script>
<script src="../../js/render/bossDesignLab.js"></script>
<script>
let paused=false,showHitbox=false,frame=0,last=0;
const cards=NV.BOSS_DESIGNS.map((design,index)=>{
 const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),note=document.createElement('p');
 title.textContent=design.bossIndex+' · '+design.name;note.textContent=design.note;
 canvas.width=600;canvas.height=340;article.append(title,canvas,note);document.getElementById('gallery').append(article);
 const boss=NV.attachBossDesign({isBoss:true,hp:1,x:260,y:170,radius:design.radius},index);
 return {boss,ctx:canvas.getContext('2d')};
});
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Reanudar':'Pausar';};
document.getElementById('hitbox').onclick=e=>{showHitbox=!showHitbox;e.target.textContent=showHitbox?'Ocultar hitbox':'Mostrar hitbox';};
function paint(now){if(!paused && last)frame+=Math.min(now-last,50)*.06;last=now;
 for(const card of cards){card.ctx.clearRect(0,0,600,340);NV.drawBossDesign(card.ctx,card.boss,frame,{scale:Number(document.getElementById('scale').value),showHitbox});}
 requestAnimationFrame(paint);
}requestAnimationFrame(paint);
</script></html>
