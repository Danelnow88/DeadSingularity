<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailer - DEAD SINGULARITY</title>
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #000;
        user-select: none; -webkit-user-select: none;
        font-family: 'Impact', 'Arial Black', sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at center, rgba(0,0,0,.30) 0%, rgba(0,0,0,.88) 100%);
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        color: #fff; text-align: center; cursor: pointer;
        transition: opacity 1s ease, visibility 1s;
    }
    #overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #overlay .tag {
        font: 600 13px/1 'Arial Narrow', Arial, sans-serif; letter-spacing: .6em;
        color: #ff6a4a; text-transform: uppercase; padding-left: .6em;
    }
    #overlay h1 {
        margin: 0; max-width: 90vw; line-height: 1.05;
        font-size: clamp(32px, 7vw, 120px); letter-spacing: .04em; font-weight: 900;
        background: linear-gradient(180deg, #fff4b8 0%, #f4ce61 24%, #75400b 49%, #d88b20 64%, #ffe69a 83%, #9c580e 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 6px 18px rgba(255,140,65,.4));
        animation: breathe 3s ease-in-out infinite;
    }
    #overlay .btn {
        font: 700 15px/1 Arial, sans-serif; letter-spacing: .35em; padding: 16px 30px 16px 36px;
        border: 1px solid rgba(255,255,255,.55); border-radius: 2px;
        background: rgba(255,255,255,.06);
        animation: pulse 2s ease-in-out infinite;
    }
    #overlay .sub { font: 400 12px/1.6 Arial, sans-serif; letter-spacing: .15em; color: rgba(255,255,255,.55); }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes pulse {
        0%,100% { opacity: .55; box-shadow: 0 0 0 rgba(255,60,30,0); }
        50% { opacity: 1; box-shadow: 0 0 28px rgba(255,60,30,.55); }
    }
    #hint {
        position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5;
        font: 400 11px/1 Arial, sans-serif; letter-spacing: .2em; color: rgba(255,255,255,.4);
        opacity: 0; transition: opacity 1.2s; pointer-events: none; text-transform: uppercase; white-space: nowrap;
    }
    #hint.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hint">Clic: repetir &nbsp;·&nbsp; M: silenciar &nbsp;·&nbsp; F: pantalla completa</div>

<div id="overlay">
    <div class="tag">Trailer oficial</div>
    <h1>DEAD SINGULARITY</h1>
    <div class="btn">▶ &nbsp;INICIAR</div>
    <div class="sub">🔊 Sube el volumen para la mejor experiencia</div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay');
const hint = document.getElementById('hint');

const TAU = Math.PI * 2;
const R = Math.random;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const kick = (tt, t0, k) => tt < t0 ? 0 : Math.exp(-(tt - t0) * k);

function rng(seed) {
    return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function sprite(stops, w = 128, h = 128) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    return c;
}

const spDust  = sprite([[0, 'rgba(138,103,78,.75)'], [.5, 'rgba(82,55,46,.35)'], [1, 'rgba(40,24,24,0)']]);
const spSmoke = sprite([[0, 'rgba(18,13,18,.85)'], [.6, 'rgba(25,16,20,.35)'], [1, 'rgba(14,8,16,0)']]);
const spGlow  = sprite([[0, 'rgba(255,243,210,1)'], [.25, 'rgba(255,162,65,.55)'], [1, 'rgba(235,64,16,0)']]);
const spMag   = sprite([[0, 'rgba(210,91,62,.65)'], [.3, 'rgba(126,30,48,.3)'], [1, 'rgba(60,15,36,0)']]);
const spCyan  = sprite([[0, 'rgba(150,235,255,.9)'], [.4, 'rgba(50,170,255,.3)'], [1, 'rgba(20,110,255,0)']]);
const spBlack = sprite([[0, 'rgba(0,0,0,.92)'], [.6, 'rgba(0,0,0,.5)'], [1, 'rgba(0,0,0,0)']]);
const spCloud = sprite([[0, 'rgba(53,17,42,.65)'], [.55, 'rgba(35,13,32,.3)'], [1, 'rgba(25,8,26,0)']]);

/* Ruido para la estática del TV y el grano de película */
const noiseC = document.createElement('canvas'); noiseC.width = 96; noiseC.height = 72;
const noiseX = noiseC.getContext('2d');
const noiseImg = noiseX.createImageData(96, 72);
const noise32 = new Uint32Array(noiseImg.data.buffer);

const grainC = document.createElement('canvas'); grainC.width = grainC.height = 192;
(() => {
    const g = grainC.getContext('2d'); const im = g.createImageData(192, 192);
    for (let i = 0; i < im.data.length; i += 4) { const v = R() * 255; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
    g.putImageData(im, 0, 0);
})();
let grainPat = null;

const bloomC = document.createElement('canvas');
const bctx = bloomC.getContext('2d');
// Reflejo del entorno + luces de estudio; no agrega geometría ni otra cámara.
const goldEnv = document.createElement('canvas'); goldEnv.width = 256; goldEnv.height = 128;
const goldEnvCtx = goldEnv.getContext('2d');
const metalMask = document.createElement('canvas'), metalMaskCtx = metalMask.getContext('2d');
const filmGrain = document.createElement('canvas'), filmGrainCtx = filmGrain.getContext('2d');

/* =====================================================================
   LÍNEA DE TIEMPO (segundos)
   ===================================================================== */
const T_SHOW1 = 2.2;   // aparece JUEGO cayendo
const T1      = 4.0;   // JUEGO golpea el TV
const TG1     = 4.14;  // JUEGO toca el suelo
const T_SHOW2 = 4.35;  // aparece DEMO cayendo
const T2      = 5.1;   // DEMO impacta + arranca el riff

/* =====================================================================
   ESTADO
   ===================================================================== */
let W, H, dpr, U, cx, cy, hy, baseY;
let tv, titles, layers, clouds, stars, cracks, rocks, fgDebris, skyG, groundG, hazeG;
let startY, startY2, hitY, demoBase;
let started = false, tStart = 0, t = 0, amb = 0, lastNow = 0;
let zoom = 1, roll = 0, shx = 0, shy = 0, vpX = 0, vpY = 0;
let tvDestroyed = false, flashA = 0, shakeAmp = 0, smokeAcc = 0;
let events = [], endFired = false;
let shards = [], sparks = [], dust = [], rings = [], embers = [], streaks = [], puffs = [], shooters = [];

/* =====================================================================
   CONSTRUCCIÓN DE ESCENA (se rehace al redimensionar)
   ===================================================================== */
function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    bloomC.width = Math.ceil(cv.width / 4); bloomC.height = Math.ceil(cv.height / 4);
    metalMask.width = filmGrain.width = cv.width;
    metalMask.height = filmGrain.height = cv.height;
    U = Math.min(H, W / 1.6) / 700;
    build();
}

function makeIslands(r, o) {
    // Misma capa/parallax; nueva silueta terrestre de ruinas industriales.
    const items = [];
    for (let i = 0; i < o.n + 2; i++) {
        const w = W * 1.5 / o.n, x = -W * .25 + i * w;
        const y = hy + (o.depth * 22 - 12) * U;
        const h = H * lerp(.10, .43, r()) * (.45 + o.depth);
        const p = new Path2D(), fires = [], wins = [];
        p.moveTo(x, y + 45 * U);
        p.lineTo(x, y - h * .3);
        p.lineTo(x + w * .2, y - h * .58);
        p.lineTo(x + w * .36, y - h);
        p.lineTo(x + w * .50, y - h * .46);
        p.lineTo(x + w * .65, y - h * .82);
        p.lineTo(x + w * .82, y - h * .32);
        p.lineTo(x + w, y - h * .48);
        p.lineTo(x + w, y + 45 * U); p.closePath();
        if (r() < .6) {
            const px = x + w * .2, top = y - h * .58 - 35 * U;
            p.rect(px - 3 * U, top, 6 * U, y - top);
            fires.push({ x: px, y: top, size: 18 * U, ph: r() * TAU });
        }
        for (let j = 0; j < 3; j++) if (r() < .45) wins.push({ x: x + w * (.2 + r() * .6), y: y - h * r() * .3 });
        items.push({ p, x, y, w, h, fires, wins });
    }
    return Object.assign({}, o, { items });
}

function fillHoles(sil){
    const w = sil.width, h = sil.height;
    const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
    const g = tmp.getContext('2d');
    g.drawImage(sil,0,0);
    const img = g.getImageData(0,0,w,h);
    const data = img.data;
    const visited = new Uint8Array(w*h);
    const q = [];
    const isTrans = (x,y)=>{
        const i = (y*w+x)*4+3;
        return data[i] < 10;
    };
    for(let x=0;x<w;x++){
        if(isTrans(x,0)){ const i=x; if(!visited[i]){visited[i]=1; q.push([x,0]);} }
        if(isTrans(x,h-1)){ const i=(h-1)*w+x; if(!visited[i]){visited[i]=1; q.push([x,h-1]);} }
    }
    for(let y=0;y<h;y++){
        if(isTrans(0,y)){ const i=y*w; if(!visited[i]){visited[i]=1; q.push([0,y]);} }
        if(isTrans(w-1,y)){ const i=y*w+(w-1); if(!visited[i]){visited[i]=1; q.push([w-1,y]);} }
    }
    let qi=0;
    while(qi<q.length){
        const [cx,cy]=q[qi++];
        const neigh=[[1,0],[-1,0],[0,1],[0,-1]];
        for(const [dx,dy] of neigh){
            const nx=cx+dx, ny=cy+dy;
            if(nx<0||nx>=w||ny<0||ny>=h) continue;
            const idx=ny*w+nx;
            if(visited[idx]) continue;
            if(!isTrans(nx,ny)) continue;
            visited[idx]=1;
            q.push([nx,ny]);
        }
    }
    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            const idx=y*w+x;
            const aIdx=idx*4+3;
            if(data[aIdx]<10 && !visited[idx]){
                data[aIdx]=255;
                data[aIdx-1]=255;
                data[aIdx-2]=255;
                data[aIdx-3]=255;
            }
        }
    }
    g.putImageData(img,0,0);
    return tmp;
}

function renderTitle(text, size, pal, seed) {
    const r = rng(seed);
    const mix = (a, b, k) => `rgb(${lerp(a[0], b[0], k) | 0},${lerp(a[1], b[1], k) | 0},${lerp(a[2], b[2], k) | 0})`;
    const m = document.createElement('canvas').getContext('2d');
    const font = `900 ${size}px Impact, 'Arial Black', Haettenschweiler, sans-serif`;
    m.font = font;
    const sp = size * 0.004;
    let tw = 0; for (const ch of text) tw += m.measureText(ch).width + sp; tw -= sp;
    const asc = m.measureText(text).actualBoundingBoxAscent || size * 0.75;
    const pad = size * 0.07;
    const w = Math.ceil(tw + pad * 2), h = Math.ceil(asc + pad * 2);
    const bx = pad, by = pad + asc, lw = size * 0.035;
    const mk = (sc) => {
        const c = document.createElement('canvas'); c.width = Math.ceil(w * sc); c.height = Math.ceil(h * sc);
        const g = c.getContext('2d'); g.scale(sc, sc); g.font = font; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
        return [c, g];
    };
    const paint = (g, mode) => {
        let x = bx;
        for (const ch of text) { if (mode === 'fill') g.fillText(ch, x, by); else g.strokeText(ch, x, by); x += g.measureText(ch).width + sp; }
    };

    // ---- cara frontal (metal con bisel y desgaste)
    const [c, g] = mk(dpr);
    g.strokeStyle = '#000'; g.lineWidth = lw; paint(g, 'stroke');
    const grad = g.createLinearGradient(0, by - asc, 0, by);
    pal.stops.forEach(st => grad.addColorStop(st[0], st[1]));
    g.fillStyle = grad; paint(g, 'fill');
    g.save(); g.translate(-size * .004, -size * .004);
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = Math.max(1.5, size * 0.008); paint(g, 'stroke'); g.restore();
    g.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < 24; i++) {
        g.fillStyle = `rgba(0,0,0,${.025 + r() * .04})`;
        const q = .5 + r(); g.fillRect(r() * w, r() * h, q, q);
    }
    g.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
        const x = r() * w, y = r() * h, l = 10 + r() * 55;
        g.strokeStyle = `rgba(255,238,182,${.03 + r() * .055})`;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * .7, y + l * .5); g.stroke();
    }
    for (let i = 0; i < 6; i++) {
        const x = r() * w, y = r() * h, l = 8 + r() * 40;
        g.strokeStyle = `rgba(0,0,0,${.025 + r() * .04})`;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * .8, y - l * .3); g.stroke();
    }
    // Textura de metal: cepillado y reflejos se cachean al construir, no por frame.
    for (let i = 0; i < 20; i++) {
        const x = r() * w, y = r() * h;
        g.strokeStyle = i % 3 ? 'rgba(255,255,255,.018)' : 'rgba(0,0,0,.025)';
        g.lineWidth = .5;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + size * (.1 + r() * .65), y + .5); g.stroke();
    }
    for (let i = 0; i < 24; i++) {
        const x = r() * w, y = r() * h, s = .5 + r() * 1.4;
        g.fillStyle = i % 3 ? 'rgba(255,245,210,.7)' : 'rgba(255,181,89,.6)';
        g.fillRect(x, y, s, s);
    }
    g.globalCompositeOperation = 'source-over';

    // Pequeños reflejos de metal caliente, cacheados y recortados a la cara.
    const [glints, gg] = mk(dpr);
    for (let i = 0; i < 20; i++) {
        const x = r() * w, y = r() * h, radius = size * (.008 + r() * .009);
        const light = gg.createRadialGradient(x, y, 0, x, y, radius);
        light.addColorStop(0, 'rgba(255,255,242,.95)');
        light.addColorStop(.22, 'rgba(255,210,126,.65)');
        light.addColorStop(1, 'rgba(255,150,55,0)');
        gg.fillStyle = light; gg.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
    gg.globalCompositeOperation = 'destination-in'; gg.drawImage(c, 0, 0, w, h);

    // ---- caras del volumen: silueta + banda superior iluminada (bordes que miran hacia arriba)
    const [sil, sg] = mk(1);
    sg.fillStyle = sg.strokeStyle = '#fff'; sg.lineWidth = lw; paint(sg, 'stroke'); paint(sg, 'fill');
    const kb = Math.max(4, Math.round(size * 0.03));
    const [band, bg] = mk(1);
    bg.drawImage(sil, 0, 0); bg.globalCompositeOperation = 'destination-out'; bg.drawImage(sil, 0, kb);
    const K = 10, sides = [];
    for (let k = 0; k < K; k++) {
        const f = k / (K - 1);
        const [sc, g2] = mk(1);
        g2.drawImage(sil, 0, 0); g2.globalCompositeOperation = 'source-in';
        g2.fillStyle = mix(pal.sideNear, pal.sideFar, f); g2.fillRect(0, 0, w, h);
        // Continuidad especular: la banda de bisel no se repite en cada capa.
        sides.push(sc);
    }
    const solidSil = fillHoles(sil);
    // solid sides tinted same as sides but from solid (no holes)
    const solidSides = [];
    for(let k=0;k<K;k++){
        const f = k/(K-1);
        const [sc2,g3] = mk(1);
        g3.drawImage(solidSil,0,0); g3.globalCompositeOperation='source-in';
        g3.fillStyle = mix(pal.sideNear, pal.sideFar, f); g3.fillRect(0,0,w,h);
        solidSides.push(sc2);
    }
    const tmp = document.createElement('canvas'); tmp.width = c.width; tmp.height = c.height;
    const [faceMask, fm] = mk(dpr); fm.fillStyle = '#fff'; paint(fm, 'fill');
    const [reflection, reflectionCtx] = mk(dpr);
    return { c, glints, tmp, tmpCtx: tmp.getContext('2d'), w, h, bx, by, tw, asc, sides, solid: solidSil, solidSides,
        faceMask, reflection, reflectionCtx, sideContexts: solidSides.map(side => side.getContext('2d')), lastReflection: -1 };
}

function build() {
    const r = rng(1337);
    hy = H * 0.56; baseY = H * 0.78; cx = W / 2; cy = H * 0.72;
    tv = { w: 86 * U, h: 172 * U };

    layers = [
        makeIslands(r, { depth: .35, n: 9, color: '#391923', haze: .28 }),
        makeIslands(r, { depth: .55, n: 7, color: '#1b0d14', haze: .16 }),
        makeIslands(r, { depth: .80, n: 5, color: '#08070b', haze: .06 })
    ];

    stars = [[], [], []];
    [100, 50, 24].forEach((cnt, l) => {
        for (let i = 0; i < cnt; i++) stars[l].push({ x: r() * W * 1.5 - W * .25, y: r() * hy * 1.05 - H * .1, r: [.55, .9, 1.5][l] * U * (.6 + r() * .8), ph: r() * TAU, c: r() });
    });

    clouds = [];
    const nsp = [spCloud, spMag, spSmoke, spCloud, spSmoke, spMag];
    for (let i = 0; i < 20; i++) clouds.push({
        x: r() * W * 1.6 - W * .3, y: r() * hy - H * .05,
        rx: lerp(160, 460, r()) * U, ry: lerp(70, 200, r()) * U,
        sp: lerp(1.5, 6, r()) * U, a: lerp(.12, .38, r()), s: nsp[(r() * nsp.length) | 0], rot: (r() - .5) * 1.4
    });

    skyG = ctx.createLinearGradient(0, 0, 0, hy);
    [[0, '#05030c'], [.3, '#190b26'], [.6, '#3e132c'], [.85, '#791f29'], [1, '#bb4524']].forEach(s => skyG.addColorStop(s[0], s[1]));
    groundG = ctx.createLinearGradient(0, hy, 0, H * 1.5);
    [[0, '#271712'], [.15, '#100d0d'], [1, '#030204']].forEach(s => groundG.addColorStop(s[0], s[1]));
    hazeG = ctx.createLinearGradient(0, hy - H * .17, 0, hy + 40 * U);
    hazeG.addColorStop(0, 'rgba(185,57,35,0)'); hazeG.addColorStop(1, 'rgba(225,88,38,.65)');

    // rocas del suelo
    rocks = [];
    for (let i = 0; i < 26; i++) {
        const y = lerp(hy + 12 * U, H * 1.02, Math.pow(r(), 1.5)), k = (y - hy) / (H - hy);
        rocks.push({ x: r() * W * 1.4 - W * .2, y, w: lerp(10, 46, r()) * U * (.4 + k), h: lerp(5, 18, r()) * U * (.4 + k) });
    }

    // grietas radiales desde el punto de impacto
    cracks = [];
    for (let i = 0; i < 16; i++) {
        let a = r() * TAU, x = 0, y = 0; const pts = [[0, 0]];
        const n = 8 + (r() * 7 | 0);
        for (let s = 0; s < n; s++) {
            a += (r() - .5) * .9; const l = lerp(18, 42, r()) * U * (1 + s * .05);
            x += Math.cos(a) * l; y += Math.sin(a) * l * .3; pts.push([x, y]);
        }
        cracks.push(pts);
    }

    // escombros de primer plano (parallax fuerte)
    const P = (arr) => { const p = new Path2D(); arr.forEach((q, i) => i ? p.lineTo(q[0] * W, q[1] * H) : p.moveTo(q[0] * W, q[1] * H)); p.closePath(); return p; };
    fgDebris = [
        P([[-.12, 1.1], [-.12, .82], [.01, .77], [.05, .83], [.10, .81], [.17, .93], [.24, 1.1]]),
        P([[1.12, 1.1], [1.12, .85], [.98, .80], [.94, .87], [.89, .84], [.82, .95], [.76, 1.1]])
    ];

    // partículas ambientales
    embers = [];
    for (let i = 0; i < 120; i++) embers.push({ x: R() * W * 1.2 - W * .1, y: R() * H * 1.1, vx: lerp(5, 40, R()) * U, vy: -lerp(14, 70, R()) * U, r: lerp(.8, 2.6, R()) * U, ph: R() * TAU, hue: R() });
    streaks = [];
    for (let i = 0; i < 28; i++) streaks.push({ x: R() * W, y: R() * H, l: lerp(60, 240, R()) * U, sp: lerp(500, 1400, R()) * U, a: lerp(.03, .12, R()) });

    // títulos (losas 3D)
    const tsize = Math.min(W * 0.15, 250 * U);
    // Medir con la misma fuente/espaciado del renderer antes de generar máscaras.
    // El margen incluye la profundidad y el zoom final de la cámara existente.
    const fitTitleSize = (text, wanted, maxWidth) => {
        const measure = document.createElement('canvas').getContext('2d');
        measure.font = `900 ${wanted}px Impact, 'Arial Black', Haettenschweiler, sans-serif`;
        const width = [...text].reduce((total, letter) => total + measure.measureText(letter).width, 0)
            + (text.length - 1) * wanted * .004 + wanted * .14;
        return wanted * Math.min(1, maxWidth / (width + 2));
    };
    titles = {
        J: renderTitle('SINGULARITY', fitTitleSize('SINGULARITY', tsize, W * .76), {
            stops: [[0, '#fff5bb'], [.14, '#ffe795'], [.30, '#e7b647'], [.46, '#9e590e'], [.50, '#6b3506'], [.58, '#be7b19'], [.76, '#f7ca62'], [.90, '#fff0ac'], [1, '#b77518']],
            sideNear: [143, 84, 15], sideFar: [43, 21, 5], topNear: [255, 224, 127], topFar: [166, 105, 24]
        }, 11),
        D: renderTitle('DEAD', fitTitleSize('DEAD', tsize * 1.12, W * .48), {
            stops: [[0, '#fff8c7'], [.16, '#ffe69a'], [.31, '#e9b64e'], [.47, '#99520b'], [.51, '#673206'], [.62, '#c78624'], [.78, '#f8ce70'], [.91, '#fff2b5'], [1, '#bb7b21']],
            sideNear: [158, 92, 17], sideFar: [48, 23, 5], topNear: [255, 230, 143], topFar: [183, 115, 30]
        }, 23)
    };
    startY  = -H * 0.45;
    startY2 = -H * 0.30;
    hitY    = baseY - tv.h * 1.08;

    grainPat = ctx.createPattern(grainC, 'repeat');
}

/* =====================================================================
   AUDIO (Web Audio API, todo sintetizado)
   ===================================================================== */
let ac = null, master, bus, noiseBuf, distCurve, pumpTimer = null, nextBar = 0, barIdx = 0, muted = false;

function initAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 3;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .2;
    master.connect(comp); comp.connect(ac.destination);

    // reverb sintética
    const rl = ac.sampleRate * 2.2, ib = ac.createBuffer(2, rl, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const dd = ib.getChannelData(ch); for (let i = 0; i < rl; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6); }
    const conv = ac.createConvolver(); conv.buffer = ib;
    const wet = ac.createGain(); wet.gain.value = .28;
    bus = ac.createGain(); bus.gain.value = 1;
    bus.connect(master); bus.connect(wet); wet.connect(conv); conv.connect(master);

    distCurve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; distCurve[i] = Math.tanh(x * 8); }
}

function noiseSrc(loop) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = loop; return s; }

function noiseBurst(time, o) {
    const type = o.type || 'lowpass', dur = o.dur || .3, out = o.out || bus;
    const s = noiseSrc(false), f = ac.createBiquadFilter(); f.type = type; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, time);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, time + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(o.gain, time); g.gain.exponentialRampToValueAtTime(.0001, time + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(time, R() * Math.max(0, 3 - dur - .1)); s.stop(time + dur + .05);
}

function tone(time, o) {
    const dur = o.dur, out = o.out || bus;
    const os = ac.createOscillator(); os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.f0, time);
    if (o.f1) os.frequency.exponentialRampToValueAtTime(o.f1, time + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(o.gain, time); g.gain.exponentialRampToValueAtTime(.0001, time + dur);
    os.connect(g); g.connect(out); os.start(time); os.stop(time + dur + .05);
}

function boom(time, p) {
    tone(time, { f0: 120, f1: 30, gain: 1.0 * p, dur: 1.3 });
    tone(time, { type: 'triangle', f0: 200, f1: 55, gain: .5 * p, dur: .5 });
    noiseBurst(time, { f0: 5000, f1: 150, gain: .9 * p, dur: .9, q: .7 });
    noiseBurst(time, { type: 'highpass', f0: 2500, gain: .5 * p, dur: .12 });
    noiseBurst(time, { f0: 600, f1: 80, gain: .8 * p, dur: 2.0 });
}

function riser(time, dur, f0, f1, g1) {
    const s = noiseSrc(true), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 5;
    f.frequency.setValueAtTime(f0, time); f.frequency.exponentialRampToValueAtTime(f1, time + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(g1, time + dur * .98); g.gain.linearRampToValueAtTime(0, time + dur + .02);
    s.connect(f); f.connect(g); g.connect(master); s.start(time); s.stop(time + dur + .05);
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 / 5, time); o.frequency.exponentialRampToValueAtTime(f1 / 6, time + dur);
    const og = ac.createGain(); og.gain.setValueAtTime(.0001, time);
    og.gain.exponentialRampToValueAtTime(g1 * .22, time + dur * .98); og.gain.linearRampToValueAtTime(0, time + dur + .02);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    o.connect(lp); lp.connect(og); og.connect(master); o.start(time); o.stop(time + dur + .05);
}

function guitar(time, f, dur) {
    [1, 1.4983, 2].forEach((m, i) => {
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * m; o.detune.value = (i - 1) * 6;
        const ws = ac.createWaveShaper(); ws.curve = distCurve; ws.oversample = '2x';
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800;
        const g = ac.createGain(); g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(.16, time + .008); g.gain.exponentialRampToValueAtTime(.0001, time + dur);
        o.connect(ws); ws.connect(lp); lp.connect(g); g.connect(bus); o.start(time); o.stop(time + dur + .02);
    });
}

const kickD  = time => tone(time, { f0: 160, f1: 42, gain: .9, dur: .22, out: master });
const snareD = time => { noiseBurst(time, { type: 'bandpass', f0: 1900, q: .6, gain: .45, dur: .18 }); tone(time, { type: 'triangle', f0: 200, f1: 120, gain: .3, dur: .1 }); };
const hatD   = (time, open) => noiseBurst(time, { type: 'highpass', f0: 7500, gain: .1, dur: open ? .2 : .045 });
const crashD = time => noiseBurst(time, { type: 'highpass', f0: 4000, gain: .35, dur: 1.8 });

const RIFF_A = [0, 0, null, 0, 0, null, 3, null, 0, 0, null, 0, 5, null, 6, 7];
const RIFF_B = [0, 0, null, 0, 0, null, 3, null, 0, 0, null, 0, 6, 5, 3, null];
const KICKS = [0, 3, 6, 8, 10, 14];

function scheduleBar(tb, idx) {
    const s = .1, steps = idx % 2 === 0 ? RIFF_A : RIFF_B;
    steps.forEach((n, i) => { if (n !== null) guitar(tb + i * s, 82.41 * Math.pow(2, n / 12), n === 0 ? s * .8 : s * 1.7); });
    KICKS.forEach(i => kickD(tb + i * s));
    [4, 12].forEach(i => snareD(tb + i * s));
    for (let i = 0; i < 16; i += 2) hatD(tb + i * s, i === 14);
    if (idx % 4 === 0) crashD(tb);
}

function pump() { if (!ac) return; while (nextBar < ac.currentTime + .5) { scheduleBar(nextBar, barIdx++); nextBar += 1.6; } }

function scheduleAudio(t0) {
    const T = x => t0 + x;
    // viento
    const wind = noiseSrc(true), wbp = ac.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 420; wbp.Q.value = .7;
    const lfo = ac.createOscillator(); lfo.frequency.value = .13; const lg = ac.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(wbp.frequency);
    const wg = ac.createGain(); wg.gain.setValueAtTime(0, t0); wg.gain.linearRampToValueAtTime(.2, T(1.5)); wg.gain.linearRampToValueAtTime(.05, T(5.5));
    wind.connect(wbp); wbp.connect(wg); wg.connect(master); wind.start(t0); lfo.start(t0);

    // drone grave que crece
    const lpD = ac.createBiquadFilter(); lpD.type = 'lowpass'; lpD.frequency.setValueAtTime(120, T(.2)); lpD.frequency.exponentialRampToValueAtTime(900, T(T1));
    const dg = ac.createGain(); dg.gain.setValueAtTime(0, T(.2)); dg.gain.linearRampToValueAtTime(.22, T(T1)); dg.gain.setValueAtTime(.05, T(T1 + .05));
    [41.2, 41.7, 61.8].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lpD); o.start(T(.2)); });
    lpD.connect(dg); dg.connect(master);

    // estática + zumbido del TV (hasta el impacto)
    const st = noiseSrc(true), hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
    const sg = ac.createGain(); sg.gain.setValueAtTime(0, t0); sg.gain.linearRampToValueAtTime(.05, T(.6));
    sg.gain.linearRampToValueAtTime(.12, T(T1 - .05)); sg.gain.setValueAtTime(0, T(T1));
    st.connect(hp); hp.connect(sg); sg.connect(master); st.start(t0); st.stop(T(T1 + .02));
    const hum = ac.createOscillator(); hum.type = 'sine'; hum.frequency.value = 120; const hg = ac.createGain();
    hg.gain.setValueAtTime(.03, t0); hg.gain.setValueAtTime(0, T(T1)); hum.connect(hg); hg.connect(master); hum.start(t0); hum.stop(T(T1 + .02));

    // pad cósmico + zumbido agudo del celular
    const padLp = ac.createBiquadFilter(); padLp.type = 'lowpass'; padLp.frequency.value = 1400;
    const padG = ac.createGain(); padG.gain.setValueAtTime(0, T(.3)); padG.gain.linearRampToValueAtTime(.07, T(T1)); padG.gain.setValueAtTime(.025, T(T1 + .05));
    [110, 164.81, 220, 277.18, 329.63].forEach((f, i) => {
        const o = ac.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = (i - 2) * 5;
        const l = ac.createOscillator(); l.frequency.value = .08 + i * .03; const lgn = ac.createGain(); lgn.gain.value = 6; l.connect(lgn); lgn.connect(o.detune);
        o.connect(padLp); o.start(T(.3)); l.start(T(.3));
    });
    padLp.connect(padG); padG.connect(bus);
    const whine = ac.createOscillator(); whine.type = 'sine'; whine.frequency.setValueAtTime(2400, t0); whine.frequency.linearRampToValueAtTime(3600, T(T1));
    const whg = ac.createGain(); whg.gain.setValueAtTime(0, t0); whg.gain.linearRampToValueAtTime(.012, T(1)); whg.gain.linearRampToValueAtTime(.03, T(T1 - .05)); whg.gain.setValueAtTime(0, T(T1));
    whine.connect(whg); whg.connect(master); whine.start(t0); whine.stop(T(T1 + .02));

    // tensión previa
    riser(T(T_SHOW1 - .2), T1 - T_SHOW1 + .2, 300, 6000, .35);
    riser(T(T_SHOW2 - .05), T2 - T_SHOW2 + .05, 400, 8000, .3);

    // golpe contra el TV: plástico, cristal
    noiseBurst(T(T1), { type: 'highpass', f0: 3000, gain: .6, dur: .25 });
    noiseBurst(T(T1), { type: 'bandpass', f0: 900, q: .8, gain: .5, dur: .3 });
    tone(T(T1), { f0: 90, f1: 40, gain: .6, dur: .4 });
    for (let i = 0; i < 24; i++) {
        const tm = T(T1) + R() * .6;
        noiseBurst(tm, { type: 'bandpass', f0: 4000 + R() * 5000, q: 12, gain: .09 * (.4 + R()), dur: .07 });
        tone(tm, { f0: 2500 + R() * 4000, gain: .03, dur: .12 });
    }
    // suelo
    boom(T(TG1), 1.15);
    // segundo golpe
    boom(T(T2), 1.5); crashD(T(T2));
    noiseBurst(T(T2), { type: 'highpass', f0: 3000, gain: .5, dur: .3 });
}

/* =====================================================================
   EVENTOS VISUALES
   ===================================================================== */
function spawnSparks(x, y, n, power) {
    for (let i = 0; i < n; i++) sparks.push({
        x, y, vx: (R() - .5) * 2 * power * U, vy: -(R() * power * .9 + power * .2) * U,
        life: 0, max: lerp(.4, 1.1, R()), g: 1800 * U
    });
    if (sparks.length > 450) sparks.splice(0, sparks.length - 450);
}
function spawnDust(x, y, n, spread, smokeKind) {
    for (let i = 0; i < n; i++) dust.push({
        x: x + (R() - .5) * spread, y: y + (R() - .5) * 10 * U,
        vx: (R() - .5) * 320 * U, vy: -R() * 90 * U,
        r: lerp(20, 60, R()) * U, grow: lerp(25, 60, R()) * U,
        life: 0, max: lerp(1.2, 2.6, R()), a: lerp(.35, .6, R()), smoke: !!smokeKind
    });
}
function spawnShards() {
    const x0 = cx, y0 = baseY - tv.h * .5;
    const neon = ['#6af0ff', '#ff6ae6', '#b48cff', '#ffffff'];
    for (let i = 0; i < 100; i++) {
        const q = R(), k = q < .34 ? 'glass' : q < .56 ? 'metal' : q < .70 ? 'plastic' : q < .82 ? 'circuit' : 'pix';
        const size = (k === 'pix' ? lerp(2.5, 7, R()) : lerp(4, 24, Math.pow(R(), 1.6))) * U, n = 3 + (R() * 2 | 0), pts = [];
        const a0 = R() * TAU;
        for (let j = 0; j < n; j++) { const a = a0 + j / n * TAU + (R() - .5) * .8, rd = size * (.5 + R() * .7); pts.push([Math.cos(a) * rd, Math.sin(a) * rd]); }
        shards.push({
            x: x0 + (R() - .5) * tv.w, y: y0 + (R() - .5) * tv.h,
            vx: (R() - .5) * 1150 * U, vy: -(R() * 650 + 120) * U, rot: R() * TAU, vr: (R() - .5) * 18,
            pts, kind: k, col: neon[(R() * 4) | 0], gy: baseY + (R() - .3) * 28 * U, settled: false
        });
    }
    if (shards.length > 300) shards.splice(0, shards.length - 300);
}
function ring(maxR, w) { rings.push({ x: cx, y: baseY + 8 * U, r: 10 * U, maxR, life: 0, max: .95, w }); }

function buildEvents() {
    events = [
        { t: T1, done: false, fn() {
            tvDestroyed = true; spawnShards(); spawnSparks(cx, baseY - tv.h * .5, 110, 900);
            flashA = .75; shakeAmp = Math.max(shakeAmp, 14 * U);
        } },
        { t: TG1, done: false, fn() {
            spawnDust(cx, baseY, 28, titles.J.tw * .9); ring(W * .6, 16 * U);
            spawnSparks(cx, baseY, 100, 700);
            flashA = 1; shakeAmp = Math.max(shakeAmp, 30 * U);
        } },
        { t: T2, done: false, fn() {
            const yb = projY(baseY - titles.J.asc, SF_D), hw = titles.D.tw * .5 * SF_D;
            spawnDust(projX(cx, SF_D), yb, 34, titles.D.tw * SF_D);
            spawnDust(cx, baseY, 18, titles.J.tw);
            ring(W * .75, 20 * U);
            spawnSparks(projX(cx, SF_D) - hw, yb, 70, 650);
            spawnSparks(projX(cx, SF_D) + hw, yb, 70, 650);
            // Chispas sobre la unión real de las dos losas, sin un impacto nuevo.
            for (let i = 0; i < 7; i++) spawnSparks(projX(cx, SF_D) + hw * (i / 3 - 1), yb, 12, 420);
            flashA = .8; shakeAmp = Math.max(shakeAmp, 40 * U);
        } }
    ];
}

function start() {
    if (ac) { try { ac.close(); } catch (e) {} }
    clearInterval(pumpTimer);
    initAudio(); ac.resume();
    const lead = .25, t0a = ac.currentTime + lead;
    tStart = performance.now() / 1000 + lead;
    started = true;
    shards = []; sparks = []; dust = []; rings = []; puffs = []; shooters = []; endFired = false;
    tvDestroyed = false; flashA = 0; shakeAmp = 0;
    buildEvents();
    scheduleAudio(t0a);
    nextBar = t0a + T2; barIdx = 0;
    pumpTimer = setInterval(pump, 100); pump();
    overlay.classList.add('hide'); hint.classList.remove('show');
}

/* =====================================================================
   ACTUALIZACIÓN
   ===================================================================== */
function update(dt) {
    flashA *= Math.exp(-dt * 6.5);
    shakeAmp *= Math.exp(-dt * 5);

    for (const e of embers) {
        e.x += (e.vx + Math.sin(amb * 1.3 + e.ph) * 14 * U) * dt; e.y += e.vy * dt;
        if (e.y < -20 || e.x > W * 1.15) { e.x = R() * W * 1.2 - W * .1; e.y = H * (1.02 + R() * .1); }
    }
    for (const s of streaks) { s.x -= s.sp * dt; if (s.x + s.l < 0) { s.x = W + R() * 200; s.y = R() * H; } }

    // estrellas fugaces
    if (R() < dt * .35) shooters.push({ x: W * (.25 + R() * .85), y: H * (.04 + R() * .3), vx: -(700 + R() * 600) * U, vy: (180 + R() * 220) * U, life: 0, max: .7 + R() * .5 });
    for (let i = shooters.length - 1; i >= 0; i--) { const sh = shooters[i]; sh.life += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt; if (sh.life > sh.max) shooters.splice(i, 1); }

    // restos del televisor
    for (const s of shards) {
        if (s.settled) continue;
        s.vy += 2200 * U * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
        if (s.y >= s.gy && s.vy > 0) {
            s.y = s.gy;
            if (Math.abs(s.vy) < 260 * U) { s.settled = true; s.vx = s.vy = s.vr = 0; }
            else { s.vy *= -.35; s.vx *= .7; s.vr *= .6; }
        }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i]; s.life += dt; s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.y > baseY + 20 * U && s.vy > 0) { s.vy *= -.3; s.vx *= .6; }
        if (s.life > s.max) sparks.splice(i, 1);
    }
    for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i]; d.life += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.exp(-dt * 1.4); d.vy *= Math.exp(-dt * .8); d.r += d.grow * dt;
        if (d.life > d.max) dust.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life += dt; r.r = lerp(10 * U, r.maxR, easeOut(r.life / r.max)); if (r.life > r.max) rings.splice(i, 1); }

    // humo y chispas del naufragio
    if (started && tvDestroyed && t < T1 + 10) {
        smokeAcc += dt;
        if (smokeAcc > .07) {
            smokeAcc = 0;
            dust.push({ x: cx + (R() - .5) * tv.w * 3.2, y: baseY - 10 * U, vx: (R() - .3) * 25 * U, vy: -lerp(50, 90, R()) * U,
                r: lerp(12, 24, R()) * U, grow: 26 * U, life: 0, max: lerp(2, 3.4, R()), a: .5, smoke: true });
        }
        if (t < T1 + 7 && R() < dt * 5) spawnSparks(cx + (R() - .5) * titles.J.tw * .9, baseY - R() * 20 * U, 6, 260);
    }
}

/* =====================================================================
   DIBUJO
   ===================================================================== */
/* Cámara 3D de los títulos: punto de fuga alto (se ven las caras superiores) que orbita lento */
const SB_J = 0.896, SF_D = 0.95, SB_D = 0.88825; // -35% grosor: J 0.84->0.896, DEMO 0.855->0.888
function projX(x, k) { return vpX + (x - vpX) * k; }
function projY(y, k) { return vpY + (y - vpY) * k; }
function updateVP() {
    const tt = started ? t : 0;
    vpX = cx + W * 0.42 * Math.sin(tt * 0.55 - 1.2); // orbita más amplia: 0.22->0.42
    vpY = hy - H * 0.62 + H * 0.035 * Math.sin(tt * 0.37 + 1) + H * 0.05 * (kick(tt, TG1, 3.5) + kick(tt, T2, 3));
}

function camera() {
    const tt = Math.max(0, t);
    let z;
    if (!started) z = 1.40 + .01 * Math.sin(amb * .5);
    else {
        z = 1.40 - .36 * easeOut(clamp(tt / 4.2));
        z += .05 * clamp((tt - 5) / 7);
        z += .055 * kick(tt, TG1, 5.5) + .075 * kick(tt, T2, 4.5) + .02 * kick(tt, T1, 8);
    }
    roll = .004 * Math.sin(amb * .5);
    if (started) roll += .012 * kick(tt, TG1, 4) * Math.sin((tt - TG1) * 26) + .016 * kick(tt, T2, 4) * Math.sin((tt - T2) * 28);
    shx = shakeAmp * (Math.sin(amb * 83) + Math.sin(amb * 47 + 1)) * .5;
    shy = shakeAmp * (Math.sin(amb * 71 + 2) + Math.sin(amb * 53)) * .5;
    return z;
}

function layer(d, fn) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(roll);
    const s = 1 + (zoom - 1) * d; ctx.scale(s, s);
    ctx.translate(-cx + shx * d + Math.sin(amb * .15) * 8 * U * d, -cy + shy * d);
    fn(); ctx.restore();
}

function drawStars(l) {

function drawShooters() {

function drawSun() {
    const px = W * .70, py = hy - H * .22, pr = H * .15;
    const ringHalf = (front) => {
        for (const [k, lw, a] of [[1.8, 7, .38], [1.97, 4, .2], [1.64, 3, .28]]) {

            ctx.beginPath(); ctx.ellipse(px, py, pr * k, pr * k * .23, -.3, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();

    const mg = ctx.createRadialGradient(mx - mr * .4, my - mr * .4, mr * .1, mx, my, mr);
    mg.addColorStop(0, '#d2c6bb'); mg.addColorStop(.6, '#5d515d'); mg.addColorStop(1, '#18131e');

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    g.addColorStop(0, '#a95a32'); g.addColorStop(.45, '#5a292b'); g.addColorStop(.85, '#1b111b'); g.addColorStop(1, '#07060b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.clip();
    for (let i = 0; i < 7; i++) {
        ctx.strokeStyle = `rgba(188,125,82,${.04 + (i % 3) * .015})`; ctx.lineWidth = pr * (.05 + (i % 3) * .02);
        ctx.beginPath(); ctx.ellipse(px, py + (i - 3) * pr * .26, pr * 1.2, pr * .11, -.25, 0, TAU); ctx.stroke();
    }
    const sh = ctx.createRadialGradient(px - pr * .55, py - pr * .5, pr * .3, px + pr * .2, py + pr * .2, pr * 1.3);

}

function drawClouds() {
    ctx.globalCompositeOperation = 'lighter';

function drawCracks() {
    if (!started || t < TG1) return;
    const p = easeOut(clamp((t - TG1) / .8));
    ctx.save(); ctx.translate(cx, baseY + 4 * U); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const pts of cracks) {

        ctx.strokeStyle = `rgba(237,${(127 + 25 * Math.sin(amb * 3)) | 0},65,${.4 + .15 * Math.sin(amb * 5)})`; ctx.lineWidth = 1.3 * U; ctx.stroke();

    ctx.textAlign = 'left'; ctx.font = `700 ${7.5 * U}px Arial, sans-serif`; ctx.fillStyle = 'rgba(255,255,255,.85)';

function drawShard(s) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    if (s.kind === 'pix') {
        const m = Math.hypot(s.pts[0][0], s.pts[0][1]) * .7 + 1;
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(.6 + .4 * Math.sin(amb * 12 + s.rot * 3));
        ctx.fillStyle = s.col; ctx.fillRect(-m, -m, m * 2, m * 2);
        ctx.drawImage(spGlow, -m * 4, -m * 4, m * 8, m * 8);
    } else {
        ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
        if (s.kind === 'glass') {
            ctx.fillStyle = `rgba(150,225,255,${.28 + .25 * Math.abs(Math.cos(s.rot * 3))})`; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.stroke();
        } else if (s.kind === 'circuit') {
            ctx.fillStyle = '#0e6a5c'; ctx.fill(); ctx.strokeStyle = 'rgba(255,215,120,.7)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = '#ffd778'; ctx.fillRect(-1, -1, 2, 2);
        } else {
            ctx.fillStyle = s.kind === 'plastic' ? '#1c1e2e' : '#aab0c8'; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
        }
    }
    ctx.restore();
}

function titleSurface(tt, p) {
    const g = tt.tmpCtx, w = tt.c.width, h = tt.c.height;
    g.globalCompositeOperation = 'copy'; g.drawImage(tt.c, 0, 0);
    const r = tt.reflectionCtx;
    r.save(); r.setTransform(1, 0, 0, 1, 0, 0);
    r.globalCompositeOperation = 'copy'; r.drawImage(goldEnv, 0, 0, w, h);
    // Oro conductor: el reflejo se tiñe por el metal, conserva luces y sombras.
    r.globalCompositeOperation = 'multiply'; r.fillStyle = '#ffd36b'; r.fillRect(0, 0, w, h);
    r.globalCompositeOperation = 'source-over'; r.globalAlpha = .88;
    const view = (vpX / W - .5), tilt = (vpY / H + .15);
    const line = (.50 + view * .08 + tilt * .04) * h;
    const band = r.createLinearGradient(0, line - h * .55, w * .025, line + h * .55);
    [[0,'#6a3205'],[.10,'#b9750d'],[.19,'#ffe396'],[.24,'#fff8de'],[.29,'#dba336'],[.42,'#96560b'],[.48,'#291102'],[.54,'#170a02'],[.60,'#ad6a0b'],[.73,'#f0bf59'],[.86,'#ffedb1'],[.92,'#b77c20'],[1,'#4b2405']].forEach(s=>band.addColorStop(...s));
    r.fillStyle = band; r.fillRect(0, 0, w, h);
    r.globalAlpha = 1; r.globalCompositeOperation = 'screen';
    // Reflejo angosto de una fuente blanca; se desplaza con el punto de fuga.
    const x = (.46 + view * .48) * w;
    const key = r.createLinearGradient(x - w * .19, 0, x + w * .19, h * .25);
    [[0,'rgba(255,240,171,0)'],[.35,'rgba(255,215,118,.10)'],[.46,'rgba(255,250,221,.82)'],[.50,'rgba(255,255,243,.98)'],[.54,'rgba(255,234,155,.70)'],[.70,'rgba(255,193,53,.09)'],[1,'rgba(255,215,96,0)']].forEach(s=>key.addColorStop(...s));
    r.fillStyle = key; r.fillRect(0, 0, w, h);
    if (p >= 0 && p <= 1) {
        const sweepX = lerp(-.3, 1.3, p) * w, sweep = r.createLinearGradient(sweepX-w*.055,0,sweepX+w*.055,h*.2);
        sweep.addColorStop(0,'rgba(255,250,215,0)');sweep.addColorStop(.5,'rgba(255,255,235,.72)');sweep.addColorStop(1,'rgba(255,250,215,0)');
        r.fillStyle=sweep;r.fillRect(0,0,w,h);
    }
    r.globalCompositeOperation = 'destination-in'; r.drawImage(tt.faceMask, 0, 0); r.restore();
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = .95; g.drawImage(tt.reflection, 0, 0); g.globalAlpha = 1;
    return tt.tmp;
}

function captureMetalEnvironment() {

function reflectMetalDepth(tt) {
    const tick = Math.floor(amb * 24);
    if (tt.lastReflection === tick) return;
    tt.lastReflection = tick;
    const view = vpX / W - .5;
    for (let i=0;i<tt.sideContexts.length;i++) {
        const g=tt.sideContexts[i], f=i/(tt.sideContexts.length-1);
        g.globalCompositeOperation='copy';g.drawImage(tt.solid,0,0);
        g.globalCompositeOperation='source-in';
        const x=(.47+view*.65-f*.045)*tt.w;
        const gradient=g.createLinearGradient(x-tt.w*.31,0,x+tt.w*.31,tt.h*.22);
        [[0,'#643006'],[.2,'#dc961b'],[.35,'#ffe690'],[.44,'#fff4c1'],[.50,'#d69826'],[.61,'#4a2104'],[.70,'#251002'],[.85,'#bd7610'],[1,'#f0bc46']].forEach(s=>gradient.addColorStop(...s));
        g.fillStyle=gradient;g.fillRect(0,0,tt.w,tt.h);g.globalCompositeOperation='source-over';
    }
}

function maskMetalAt(tt, sprite, o, k, operation) {
    const g=metalMaskCtx;
    g.save();g.setTransform(ctx.getTransform());g.globalAlpha=o.alpha;g.globalCompositeOperation=operation;
    g.translate(vpX,vpY);g.scale(k,k);g.translate(-vpX,-vpY);
    g.translate(o.px,o.py);g.rotate(o.rot);g.scale(o.sx,o.sy);
    g.drawImage(sprite,-(tt.bx+tt.tw/2),-tt.by,tt.w,tt.h);g.restore();
}

/* Dibuja un sprite en el plano de la palabra y lo proyecta hacia el punto de fuga (escala k respecto a VP) */
function drawAt(tt, spr, o, k) {
    ctx.save();
    ctx.translate(vpX, vpY); ctx.scale(k, k); ctx.translate(-vpX, -vpY);
    ctx.translate(o.px, o.py); ctx.rotate(o.rot); ctx.scale(o.sx, o.sy);
    ctx.drawImage(spr, -(tt.bx + tt.tw / 2), -tt.by, tt.w, tt.h);
    ctx.restore();
}

/* Losa 3D: capas de profundidad (de atrás hacia adelante) + cara frontal. Cada capa es la anterior escalada hacia el punto de fuga. */
function slab(tt, o) {
    const N = 30, K = tt.solidSides.length;
    reflectMetalDepth(tt);
    ctx.save(); ctx.globalAlpha = o.alpha;
    // Paredes laterales como anillos exteriores solamente -> agujeros 100% transparentes
    for (let i = N; i >= 1; i--) {
        const u = i / N;
        const u2 = (i-1)/N;
        const kOuter = lerp(o.sF, o.sB, u) * o.m;
        const kInner = lerp(o.sF, o.sB, u2) * o.m;
        const sideIdx = Math.min(K-1, (u*K)|0);
        drawAt(tt, tt.solidSides[sideIdx], o, kOuter);
        maskMetalAt(tt, tt.solid, o, kOuter, 'source-over');
        ctx.globalCompositeOperation = 'destination-out';
        drawAt(tt, tt.solid, o, kInner);
        maskMetalAt(tt, tt.solid, o, kInner, 'destination-out');
        ctx.globalCompositeOperation = 'source-over';
    }
    for (const gh of (o.ghosts || [])) {
        ctx.globalAlpha = gh.a;
        drawAt(tt, tt.c, { px: o.px, py: gh.py, rot: gh.rot, sx: o.sx, sy: o.sy }, o.sF * gh.m);
    }
    ctx.globalAlpha = o.alpha;
    const k = o.sF * o.m;
    const surf = titleSurface(tt, o.sweep);
    maskMetalAt(tt, tt.c, o, k, 'source-over');
    ctx.save();
    ctx.translate(vpX, vpY); ctx.scale(k, k); ctx.translate(-vpX, -vpY);
    ctx.translate(o.px, o.py); ctx.rotate(o.rot); ctx.scale(o.sx, o.sy);
    const dx = -(tt.bx + tt.tw / 2), dy = -tt.by;
    if (o.aber > .4) {
        ctx.shadowColor = 'rgba(255,173,84,.8)'; ctx.shadowOffsetX = -o.aber; ctx.drawImage(surf, dx, dy, tt.w, tt.h);
        ctx.shadowColor = 'rgba(207,222,236,.8)'; ctx.shadowOffsetX = o.aber;
    } else if (o.glowBlur > 0) { ctx.shadowColor = o.glowColor; ctx.shadowBlur = o.glowBlur; }
    ctx.drawImage(surf, dx, dy, tt.w, tt.h);
    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0;
    ctx.globalAlpha *= .35 + .35 * Math.pow(Math.sin(amb * 5 + tt.tw), 4);
    ctx.drawImage(tt.glints, dx, dy, tt.w, tt.h);
    ctx.restore(); ctx.restore();
}

function drawTitles() {
    const J = titles.J, D = titles.D, tt = t;
    const d1 = tt - TG1, d2 = tt - T2;
    let sq = 0;
    if (d1 > 0) sq += Math.exp(-d1 * 5.5) * Math.cos(d1 * 26);
    if (d2 > 0) sq += .8 * Math.exp(-d2 * 5) * Math.cos(d2 * 24);
    const syJ = 1 - .14 * sq, sxJ = 1 + .07 * sq;

    // sombra que se acerca y cráter chamuscado
    if (tt >= T_SHOW1 && tt < TG1) {
        const u = clamp((tt - T_SHOW1) / (T1 - T_SHOW1));
        ctx.globalAlpha = .55 * u * u; const sw = J.tw * (.4 + .6 * u);
        ctx.drawImage(spBlack, cx - sw * .6, baseY - 10 * U, sw * 1.2, 40 * U); ctx.globalAlpha = 1;
    }
    if (tt >= TG1) {
        const sc = easeOut(clamp((tt - TG1) / .5));
        ctx.globalAlpha = .85 * sc; ctx.drawImage(spBlack, cx - J.tw * .62 * sc, baseY - 14 * U, J.tw * 1.24 * sc, 46 * U); ctx.globalAlpha = 1;
    }

    // ---- JUEGO: losa apoyada en el piso
    if (tt >= T_SHOW1) {
        let py = baseY, m = 1, rot = 0, a = 1; const ghosts = [];
        if (tt < T1) {
            const u = clamp((tt - T_SHOW1) / (T1 - T_SHOW1));
            py = lerp(startY, hitY, Math.pow(u, 2.3)); m = 1 + 1.5 * Math.pow(1 - u, 1.6); rot = (1 - u) * .12; a = clamp((tt - T_SHOW1) / .3);
            if (u > .25) for (let k = 1; k <= 4; k++) {
                const uu = u - .014 * k; if (uu <= 0) continue;
                ghosts.push({ py: lerp(startY, hitY, Math.pow(uu, 2.3)), m: 1 + 1.5 * Math.pow(1 - uu, 1.6), rot: (1 - uu) * .12, a: .13 * (1 - k / 5) * a });
            }
        } else if (tt < TG1) { const v = (tt - T1) / (TG1 - T1); py = lerp(hitY, baseY, v * v); }
        slab(J, {
            px: cx, py, sF: 1, sB: SB_J, m, rot, sx: sxJ, sy: syJ, alpha: a, ghosts,
            glowColor: 'rgba(240,191,130,.65)', glowBlur: tt > TG1 ? (4 + 4 * Math.sin(amb * 2.4)) * U * clamp((tt - TG1) / .8) : 0,
            aber: tt >= TG1 ? 7 * U * kick(tt, TG1, 5) : 0,
            sweep: tt > T2 + 1.45 ? ((tt - T2 - 1.45) % 4.5) / 1.1 : -1
        });
    }

    // ---- DEMO: losa apoyada sobre la cara superior de JUEGO (un poco retrasada, deja ver el borde de JUEGO delante)
    if (tt >= T_SHOW2) {
        const yt = baseY - J.asc * syJ;
        let py = yt, m = 1, rot = 0, a = 1; const ghosts = [];
        if (tt < T2) {
            const u = clamp((tt - T_SHOW2) / (T2 - T_SHOW2));
            py = lerp(startY2, yt, Math.pow(u, 2.1)); m = 1 + 1.3 * Math.pow(1 - u, 1.6); rot = -(1 - u) * .1; a = clamp((tt - T_SHOW2) / .25);
            if (u > .25) for (let k = 1; k <= 4; k++) {
                const uu = u - .018 * k; if (uu <= 0) continue;
                ghosts.push({ py: lerp(startY2, yt, Math.pow(uu, 2.1)), m: 1 + 1.3 * Math.pow(1 - uu, 1.6), rot: -(1 - uu) * .1, a: .13 * (1 - k / 5) * a });
            }
        }
        const sd = d2 > 0 ? Math.exp(-d2 * 6) * Math.cos(d2 * 30) : 0;
        slab(D, {
            px: cx, py, sF: SF_D, sB: SB_D, m, rot, sx: 1 + .08 * sd, sy: 1 - .16 * sd, alpha: a, ghosts,
            glowColor: 'rgba(255,192,105,.6)', glowBlur: tt > T2 ? (10 + 8 * Math.sin(amb * 3)) * U * clamp((tt - T2) / .6) : 0,
            aber: tt >= T2 ? 9 * U * kick(tt, T2, 4.5) : 0,
            sweep: tt > T2 + 1.2 ? ((tt - T2 - 1.2) % 4.5) / 1.1 : -1
        });
    }
}

function drawSpaced(str, x, y, sp, t0, a0) {
    const chars = [...str], ws = chars.map(c => ctx.measureText(c).width);
    const total = ws.reduce((p, c) => p + c, 0) + sp * (chars.length - 1);
    let px = x - total / 2;
    chars.forEach((c, i) => {
        const a = clamp((t - t0 - i * .04) / .4) * a0;
        if (a > 0) { ctx.globalAlpha = a; ctx.fillText(c, px, y + (1 - clamp((t - t0 - i * .04) / .4)) * 10 * U); }
        px += ws[i] + sp;
    });
    ctx.globalAlpha = 1;
}

function drawText() {
    if (!started) return;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    // frase de apertura
    if (t > .7 && t < 2.5) {
        const a = Math.min(clamp((t - .7) / .6), clamp((2.5 - t) / .5));
        ctx.font = `400 ${17 * U}px 'Arial Narrow', Arial, sans-serif`; ctx.fillStyle = 'rgba(255,235,220,.85)';
        ctx.globalAlpha = a; const s = 'MÁS ALLÁ DE LA ÚLTIMA SEÑAL…'; const sp = 9 * U;
        const ws = [...s].map(c => ctx.measureText(c).width), total = ws.reduce((p, c) => p + c, 0) + sp * (s.length - 1);
        let px = W / 2 - total / 2; [...s].forEach((c, i) => { ctx.fillText(c, px, H * .3); px += ws[i] + sp; });
        ctx.globalAlpha = 1;
    }
    // eslogan y cierre
    ctx.font = `700 ${19 * U}px 'Arial Narrow', Arial, sans-serif`;
    ctx.shadowColor = 'rgba(150,80,255,.85)'; ctx.shadowBlur = 12 * U;
    const y = baseY + 48 * U;
    if (t > 6.0 && t < 9.7) {
        ctx.fillStyle = 'rgba(255,238,225,.95)';
        const fade = t > 9.0 ? clamp((9.7 - t) / .7) : 1;
        drawSpaced('SOBREVIVE.   RESISTE.   REPITE.', W / 2, y, 8 * U, 6.0, fade);
    }
    if (t > 9.7) { ctx.fillStyle = 'rgba(120,225,255,.95)'; ctx.shadowColor = 'rgba(60,200,255,.8)'; drawSpaced('PRÓXIMAMENTE', W / 2, y, 14 * U, 9.7, 1); }
    ctx.shadowBlur = 0;
    if (t > 12 && !hint.classList.contains('show')) hint.classList.add('show');
}

function draw() {
    metalMaskCtx.setTransform(1,0,0,1,0,0);metalMaskCtx.clearRect(0,0,metalMask.width,metalMask.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    zoom = camera(); updateVP();

    ctx.fillStyle = skyG; ctx.fillRect(0, 0, W, H);
    layer(.04, () => drawStars(0));
    layer(.10, drawClouds);
    layer(.14, drawSun);
    layer(.12, () => drawStars(1));
    layer(.20, () => drawStars(2));
    layer(.25, drawShooters);
    layer(layers[0].depth, () => drawIslands(layers[0]));
    layer(layers[1].depth, () => drawIslands(layers[1]));
    layer(layers[2].depth, () => drawIslands(layers[2]));
    captureMetalEnvironment();

    layer(1, () => {
        drawGround();
        // resplandor del TV sobre el suelo
        if (!tvDestroyed) {
            ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (.28 + .12 * Math.sin(amb * 23)) * (.8 + clamp((t - 2) / 2));
            ctx.drawImage(spCyan, cx - tv.w * 2.4, baseY - tv.w * .5, tv.w * 4.8, tv.w * 1.0);
            ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        }
        drawCracks();
        if (!tvDestroyed) drawTV();
        drawTitles();
        for (const s of shards) drawShard(s);

        // fuego del naufragio
        if (started && tvDestroyed && t < T1 + 10) {
            ctx.globalCompositeOperation = 'lighter';
            const fa = clamp(1 - (t - T1) / 10) * (.6 + .4 * Math.sin(amb * 17));
            for (const sg of [-1, 1]) { ctx.globalAlpha = fa * .7; ctx.drawImage(spGlow, cx + sg * titles.J.tw * .5 - 40 * U, baseY - 40 * U, 80 * U, 60 * U); }
            ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        }

        for (const d of dust) {
            const k = d.life / d.max; ctx.globalAlpha = d.a * (1 - k) * (d.smoke ? .9 : 1) * Math.min(1, d.life * 6);
            ctx.drawImage(d.smoke ? spSmoke : spDust, d.x - d.r, d.y - d.r * .8, d.r * 2, d.r * 1.6);
        }
        ctx.globalAlpha = 1;

        ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
        for (const s of sparks) {
            const k = 1 - s.life / s.max; ctx.strokeStyle = `rgba(255,${(130 + 115 * k) | 0},${(35 + 180 * k * k) | 0},${k})`; ctx.lineWidth = (1 + 1.6 * k) * U;
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * .035, s.y - s.vy * .035); ctx.stroke();
        }
        for (const r of rings) {
            const k = 1 - r.life / r.max;
            ctx.strokeStyle = `rgba(235,160,86,${.6 * k})`; ctx.lineWidth = r.w * k + 1; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .22, 0, 0, TAU); ctx.stroke();
            ctx.strokeStyle = `rgba(255,255,255,${.5 * k})`; ctx.lineWidth = 2 * U; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * .96, r.r * .21, 0, 0, TAU); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
    });

    // brasas flotantes
    layer(1.15, () => {
        ctx.globalCompositeOperation = 'lighter';
        for (const e of embers) { ctx.globalAlpha = clamp(.3 + .4 * Math.sin(amb * 4 + e.ph * 9)); ctx.drawImage(spGlow, e.x - e.r * 4, e.y - e.r * 4, e.r * 8, e.r * 8); }
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    });
    // escombros en primer plano
    layer(1.7, () => {
        ctx.fillStyle = '#050405'; ctx.strokeStyle = 'rgba(183,103,52,.3)'; ctx.lineWidth = 2 * U;
        for (const p of fgDebris) { ctx.fill(p); ctx.stroke(p); }
    });
    // ráfagas de polvo
    ctx.lineCap = 'round'; ctx.lineWidth = 1.3 * U;
    for (const s of streaks) { ctx.strokeStyle = `rgba(188,143,112,${s.a * .6})`; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.l, s.y - s.l * .02); ctx.stroke(); }

    /* ---------- posproceso ---------- */
    bctx.globalCompositeOperation = 'copy';
    if ('filter' in bctx) bctx.filter = 'blur(4px)';
    bctx.drawImage(cv, 0, 0, bloomC.width, bloomC.height);
    if ('filter' in bctx) bctx.filter = 'none';
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .13 + flashA * .2;
    ctx.drawImage(bloomC, 0, 0, cv.width, cv.height); ctx.restore();

    if (flashA > .01) { ctx.fillStyle = `rgba(255,241,215,${clamp(flashA)})`; ctx.fillRect(0, 0, W, H); }

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${.72 + .1 * Math.sin(amb * 1.3)})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // Conservar el grano del fondo, excluir únicamente el metal pulido.
    filmGrainCtx.setTransform(dpr,0,0,dpr,0,0);filmGrainCtx.globalCompositeOperation='copy';
    filmGrainCtx.save();filmGrainCtx.translate((R()*192)|0,(R()*192)|0);
    filmGrainCtx.fillStyle=grainPat;filmGrainCtx.fillRect(-192,-192,W+384,H+384);filmGrainCtx.restore();
    filmGrainCtx.setTransform(1,0,0,1,0,0);filmGrainCtx.globalCompositeOperation='destination-out';filmGrainCtx.drawImage(metalMask,0,0);
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.2;
    ctx.drawImage(filmGrain,0,0);ctx.restore();

    drawText();

    const bar = H * .07; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);

    const fade = started ? .45 + .55 * clamp(t / 1.6) : .45;
    if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
function frame(nowMs) {
    requestAnimationFrame(frame);
    const now = nowMs / 1000, dt = clamp(now - lastNow, 0, .05); lastNow = now; amb += dt;
    t = started ? now - tStart : 0;
    if (started) for (const e of events) if (!e.done && t >= e.t) { e.done = true; e.fn(); }
    if (started && !endFired && t > 14) { endFired = true; window.dispatchEvent(new CustomEvent('trailer:end')); }
    update(dt); draw();
}

/* =====================================================================
   CONTROLES
   ===================================================================== */
overlay.addEventListener('click', start);
cv.addEventListener('click', () => { if (started && t > 9) start(); });
window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!started && (k === ' ' || k === 'enter')) { e.preventDefault(); start(); }
    else if (k === 'r' && started) start();
    else if (k === 'escape' && started) window.dispatchEvent(new CustomEvent('trailer:skip'));
    else if (k === 'm') { muted = !muted; if (master) master.gain.value = muted ? 0 : .9; }
    else if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);
})();
</script>
