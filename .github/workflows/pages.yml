name: DeadSingularity Pages
on:
  workflow_run:
    workflows: ["V1 quality"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deadsingularity-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: source
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build:web
      - id: web
        shell: pwsh
        run: |
          $build = Get-ChildItem releases -Directory -Filter 'DeadSingularity-V1-web-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          "path=$($build.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.web.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

